name: mobile
description: "TechConnect Cameroun Mobile Application (Client & Technician)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.6.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.0
  image_picker: ^1.2.3
  intl: ^0.19.0
  url_launcher: ^6.3.0

dependency_overrides:
  path_provider_android: 2.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_size: 21

flutter_native_splash:
  color: "#1D4ED8"
  image: "assets/images/logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#1D4ED8"
    color: "#1D4ED8"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
